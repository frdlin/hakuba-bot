<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hakuba Bot · 本機測試</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #1a1f29;
    --bubble-bot: #232a36;
    --bubble-user: #0a84ff;
    --text: #e7ecf3;
    --muted: #8a94a6;
    --border: #2a3140;
    --accent: #c9a96e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang TC", "Hiragino Sans", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  header h1 .accent { color: var(--accent); }
  header .meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 16px;
    align-items: center;
  }
  header button {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  header button:hover { color: var(--text); border-color: var(--accent); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 80%;
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; }
  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user .bubble {
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--bubble-bot);
    border-bottom-left-radius: 4px;
  }
  .label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    padding: 0 4px;
  }
  .typing {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing span {
    width: 8px;
    height: 8px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-6px); }
  }

  #composer {
    padding: 16px 24px 24px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #composer-inner {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    gap: 12px;
  }
  #input {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    min-height: 48px;
    max-height: 160px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    padding: 0 24px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }

  .lang-tip {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 24px;
    line-height: 1.7;
  }
  .lang-tip code {
    background: var(--bubble-bot);
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--accent);
  }
</style>
</head>
<body>
  <header>
    <h1>The 1/3rd <span class="accent">HAKUBA</span> · Concierge Bot</h1>
    <div class="meta">
      <span id="usage">tokens: 0</span>
      <button id="reset">清空對話</button>
    </div>
  </header>

  <div id="chat">
    <div class="lang-tip">
      💬 試著用任何語言問問題，例如：<br>
      <code>請問可以滑進雪場嗎？</code> ·
      <code>How many bedrooms?</code> ·
      <code>東京から何時間?</code>
    </div>
  </div>

  <div id="composer">
    <div id="composer-inner">
      <textarea id="input" placeholder="輸入訊息... (Enter 送出, Shift+Enter 換行)" rows="1"></textarea>
      <button id="send">送出</button>
    </div>
  </div>

<script>
const sessionId = "local-" + Math.random().toString(36).slice(2);
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const usageEl = document.getElementById("usage");
const resetBtn = document.getElementById("reset");
let totalTokens = 0;

function addMessage(role, text) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = role === "user" ? "你" : "Hakuba Concierge";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function addTyping() {
  const wrap = document.createElement("div");
  wrap.className = "msg bot";
  wrap.id = "typing-indicator";
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "Hakuba Concierge";
  const bubble = document.createElement("div");
  bubble.className = "bubble typing";
  bubble.innerHTML = "<span></span><span></span><span></span>";
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  document.getElementById("typing-indicator")?.remove();
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  input.style.height = "48px";
  sendBtn.disabled = true;

  // 第一次送訊息時清空提示
  document.querySelector(".lang-tip")?.remove();

  addMessage("user", text);
  addTyping();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId, message: text }),
    });
    const data = await res.json();
    removeTyping();

    if (data.error) {
      addMessage("bot", "⚠️ 錯誤: " + data.error);
    } else {
      addMessage("bot", data.reply);
      if (data.usage) {
        totalTokens += data.usage.input_tokens + data.usage.output_tokens;
        usageEl.textContent = "tokens: " + totalTokens.toLocaleString();
      }
    }
  } catch (err) {
    removeTyping();
    addMessage("bot", "⚠️ 連線錯誤: " + err.message);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
input.addEventListener("input", () => {
  input.style.height = "48px";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});

resetBtn.addEventListener("click", async () => {
  await fetch("/api/reset", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sessionId }),
  });
  chat.innerHTML = '<div class="lang-tip">對話已清空 ✨ 再聊一次吧</div>';
  totalTokens = 0;
  usageEl.textContent = "tokens: 0";
});

input.focus();
</script>
</body>
</html>
